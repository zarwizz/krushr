[package]
name = "shrinkr"
version = "0.1.0"
description = "A lightweight, blazingly fast modern batch image converter & optimizer"
authors = ["shrinkr team"]
edition = "2021"
default-run = "shrinkr"

[lib]
name = "shrinkr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "shrinkr"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
walkdir = "2.5"
tokio = { version = "1", features = ["full"] }

# Image processing dependencies
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "ico", "gif"] }
heic = { version = "0.1", features = ["parallel"] }
webp = "0.3"
ravif = "0.13"
rgb = "0.8"
bytemuck = "1"
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
