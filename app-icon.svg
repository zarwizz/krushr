<svg width="1024" height="1024" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="krushr-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <!-- Discreet and contained glow to preserve athletic sharpness without visual thickening -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Background with 5% safety margin -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="#0b0f19" stroke="url(#strokeGrad)" stroke-width="0.8"/>

  <!-- Subtle Inner Glow Ring -->
  <rect x="6.5" y="6.5" width="87" height="87" rx="20.5" fill="none" stroke="url(#krushr-gradient)" stroke-width="0.3" stroke-opacity="0.25"/>

  <!-- Athletic, Refined Geometric Vise Press "K" (11px Thin, 8px Gap, Flush Y=18-82) -->
  <g filter="url(#glow)">
    <!-- Montant vertical gauche : largeur 11px, X=24 à 35, Y=18 à 82, rx=5.5 -->
    <rect x="24" y="18" width="11" height="64" rx="5.5" fill="url(#krushr-gradient)"/>
    <!-- Chevron droit : épaisseur 11px, flush Y=18 à 82, pointe centrale à X=43 (gap 8px), rx=5.5 -->
    <path d="M72.5 23.5L48.5 50L72.5 76.5" fill="none" stroke="url(#krushr-gradient)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
