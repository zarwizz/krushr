<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="32" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Apple Squircle Background -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="8"/>

  <!-- Subtle Inner Glow Ring -->
  <rect x="48" y="48" width="928" height="928" rx="212" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Centered Stylized "Shrink" Icon (Two Inward Arrows / Minimalist Frame) -->
  <g filter="url(#glow)">
    <!-- Top-left to Center Arrow -->
    <path d="M336 440H440V336" stroke="url(#accentGrad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M280 280L430 430" stroke="url(#accentGrad)" stroke-width="48" stroke-linecap="round"/>

    <!-- Bottom-right to Center Arrow -->
    <path d="M688 584H584V688" stroke="url(#accentGrad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M744 744L594 594" stroke="url(#accentGrad)" stroke-width="48" stroke-linecap="round"/>

    <!-- Center Target Node -->
    <circle cx="512" cy="512" r="28" fill="#38BDF8"/>
  </g>
</svg>
